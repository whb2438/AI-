server:
  port: 8080
  servlet:
    context-path: /

# ⚠️ 生产环境必须通过环境变量设置以下密钥，禁止在此文件中硬编码
spring:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/divination_pc_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "${DB_PASSWORD:000000}"
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100
        keep-alive: 60s
      thread-name-prefix: ai-async-

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

divination:
  register-give-integral: 50
  once-cost-integral: 10
  daily-limit-count: 30
  vip-extra-daily-limit: 20
  ai-prompt: "你是资深传统玄学命理师，根据用户提供的信息进行专业解读，文风古风典雅，内容详实易懂"
  allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175

# ===================== 紫微排盘引擎微服务 =====================
ziwei:
  engine-url: "${ZIWEI_ENGINE_URL:http://localhost:8090}"

# ⚠️ 生产环境必须通过环境变量设置以下密钥，禁止在此文件中硬编码
deepseek:
  api-url: https://api.deepseek.com/v1/chat/completions
  api-key: ""
  model: deepseek-chat
  timeout: 60000

jwt:
  secret: "${JWT_SECRET:divination-platform-jwt-secret-key-2026-local-dev}"
  expire-time: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  metrics:
    tags:
      application: divination-platform
    export:
      prometheus:
        enabled: true
        descriptions: true

logging:
  level:
    com.divination: debug
    com.baomidou.mybatisplus: debug

# ===================== Resilience4j 熔断/重试配置 =====================
resilience4j:
  circuitbreaker:
    instances:
      aiService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      aiService:
        max-attempts: 2
        wait-duration: 2s
        retryExceptions:
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
  timelimiter:
    instances:
      aiService:
        timeout-duration: 60s
  ratelimiter:
    instances:
      aiService:
        limit-for-period: 10
        limit-refresh-period: 60s
        timeout-duration: 5s

# ===================== 支付配置 =====================
payment:
  wechat:
    app-id: "${PAYMENT_WECHAT_APP_ID:}"
    mch-id: "${PAYMENT_WECHAT_MCH_ID:}"
    api-key: "${PAYMENT_WECHAT_API_KEY:}"
    serial-no: "${PAYMENT_WECHAT_SERIAL_NO:}"
    notify-url: "${PAYMENT_WECHAT_NOTIFY_URL:http://localhost:8080/api/payment/wechat/notify}"
    enabled: ${PAYMENT_WECHAT_ENABLED:false}
  alipay:
    app-id: "${PAYMENT_ALIPAY_APP_ID:}"
    private-key: "${PAYMENT_ALIPAY_PRIVATE_KEY:}"
    alipay-public-key: "${PAYMENT_ALIPAY_PUBLIC_KEY:}"
    notify-url: "${PAYMENT_ALIPAY_NOTIFY_URL:http://localhost:8080/api/payment/alipay/notify}"
    enabled: ${PAYMENT_ALIPAY_ENABLED:false}

# ===================== 异步线程池配置 =====================
# (合并到上方 spring.task.execution 中)
